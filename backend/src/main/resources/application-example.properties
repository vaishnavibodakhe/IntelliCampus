# =====================================================================
# IntelliCampus Spring Boot Application Properties Template (Example)
# Populate with environment variables or replace placeholders
# =====================================================================

server.port=8080

# Database Configuration (MySQL 8)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/intellicampus_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:campus_admin}
spring.datasource.password=${DB_PASSWORD:SecureCampusPassword2026!}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Spring Boot Mail (SMTP)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:your_email@gmail.com}
spring.mail.password=${SMTP_PASSWORD:your_gmail_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8

# Application Parameters
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.mail-from=${MAIL_FROM:noreply@intellicampus.edu}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
app.jwt.secret=${JWT_SECRET:4c8a91f2b6e3d7a8c1f4e5a9b2d8c3e7f1a5b9c2d8e4f1a7b3c9d5e2f8a4b6c1}
app.jwt.access-expiration-minutes=15
app.jwt.refresh-expiration-days=7
app.jwt.lockout-max-attempts=5
app.jwt.lockout-duration-minutes=15
