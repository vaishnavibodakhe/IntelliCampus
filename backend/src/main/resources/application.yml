server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: intellicampus-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:intellicampus}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${DB_USER:campus_admin}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:intellicampusacc@gmail.com}
    password: ${SMTP_PASSWORD:iyxxbhjwdkifmlgm}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
    default-encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  mail-from: ${MAIL_FROM:intellicampusacc@gmail.com}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174,http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:4c8a91f2b6e3d7a8c1f4e5a9b2d8c3e7f1a5b9c2d8e4f1a7b3c9d5e2f8a4b6c1}
    access-expiration-minutes: 15
    refresh-expiration-days: 7
    lockout-max-attempts: 5
    lockout-duration-minutes: 15
  attendance:
    photo-window-minutes: 10
    confirm-timeout-seconds: 120
    geofence-default-radius-m: 50
    geofence-max-accuracy-m: 100
    face-match-threshold: 0.45
    face-match-margin: 0.05
    spoof-min-score: 0.60
    phash-max-distance: 8
    defaulter-threshold-percent: 75
  storage:
    face-dir: ${FACE_DIR:./uploads/student-faces}
  ai:
    service-url: ${AI_SERVICE_URL:http://localhost:8000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
