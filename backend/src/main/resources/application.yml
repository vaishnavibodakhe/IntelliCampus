server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false
  servlet:
    context-path: /
  tomcat:
    max-http-form-post-size: 25MB
    max-swallow-size: 25MB

spring:
  application:
    name: intellicampus-backend
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:intellicampus}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${DB_USER:campus_admin}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  flyway:
    enabled: false
  mail:
    host: ${MAIL_HOST:${SMTP_HOST:smtp.gmail.com}}
    port: ${MAIL_PORT:${SMTP_PORT:587}}
    username: ${MAIL_USERNAME:${SMTP_USERNAME:}}
    password: ${MAIL_PASSWORD:${SMTP_PASSWORD:}}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

app:
  dev-mode: ${APP_DEV_MODE:false}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  mail-from: ${MAIL_FROM:noreply@intellicampus.edu}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174,http://localhost:3000}
  security:
    admin-email: ${ADMIN_EMAIL:admin@intellicampus.edu}
    superadmin-password: ${SUPERADMIN_PASSWORD:}
    admin-otp-enabled: ${ADMIN_OTP_ENABLED:false}
  jwt:
    secret: ${JWT_SECRET}
    access-expiration-minutes: 15
    refresh-expiration-days: 7
    lockout-max-attempts: 5
    lockout-duration-minutes: 15
  attendance:
    photo-window-minutes: 10
    confirm-timeout-seconds: 120
    geofence-default-radius-m: 50
    geofence-max-accuracy-m: 100
    face-match-threshold: 0.50
    face-review-threshold: 0.20
    face-match-margin: 0.0
    spoof-min-score: 0.60
    phash-max-distance: 8
    defaulter-threshold-percent: 75
  storage:
    face-dir: ${FACE_DIR:./uploads/student-faces}
  ai:
    service-url: ${AI_SERVICE_URL:http://localhost:8000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.intellicampus.auth: DEBUG
