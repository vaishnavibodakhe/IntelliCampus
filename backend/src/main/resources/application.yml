server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
  servlet:
    context-path: /
  tomcat:
    max-http-form-post-size: 25MB
    max-swallow-size: 25MB

spring:
  application:
    name: intellicampus-backend
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:intellicampus_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${DB_USER:campus_admin}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  flyway:
    enabled: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

app:
  dev-mode: ${APP_DEV_MODE:false}
  jwt:
    secret: ${JWT_SECRET:4f92a105c3b4e78912345678abcdef0123456789abcdef0123456789abcdef2026}
    access-expiration-minutes: 15
    refresh-expiration-days: 7
    lockout-max-attempts: 5
    lockout-duration-minutes: 15
  attendance:
    photo-window-minutes: 10
    confirm-timeout-seconds: 120
    geofence-default-radius-m: 50
    geofence-max-accuracy-m: 100
    face-match-threshold: 0.50
    face-review-threshold: 0.20
    face-match-margin: 0.0
    spoof-min-score: 0.60
    phash-max-distance: 8
    defaulter-threshold-percent: 75
  storage:
    face-dir: ${FACE_DIR:./uploads/student-faces}
  ai:
    service-url: ${AI_SERVICE_URL:http://localhost:8000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.intellicampus.auth: DEBUG
