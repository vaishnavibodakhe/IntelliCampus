services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: intellicampus-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - campus-network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: intellicampus-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-intellicampus}
      - DB_USER=${DB_USER:-campus_admin}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AI_SERVICE_URL=http://ai:8000
      - JWT_SECRET=${JWT_SECRET}
      - MAIL_HOST=${MAIL_HOST:-${SMTP_HOST:-smtp.gmail.com}}
      - MAIL_PORT=${MAIL_PORT:-${SMTP_PORT:-587}}
      - MAIL_USERNAME=${MAIL_USERNAME:-${SMTP_USERNAME:-}}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-${SMTP_PASSWORD:-}}
      - MAIL_FROM=${MAIL_FROM:-noreply@intellicampus.edu}
      - SMTP_HOST=${SMTP_HOST:-${MAIL_HOST:-smtp.gmail.com}}
      - SMTP_PORT=${SMTP_PORT:-${MAIL_PORT:-587}}
      - SMTP_USERNAME=${SMTP_USERNAME:-${MAIL_USERNAME:-}}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-${MAIL_PASSWORD:-}}
      - SETUP_TOKEN=${SETUP_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai:
        condition: service_healthy
    networks:
      - campus-network

  ai:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: intellicampus-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - campus-network

  db:
    image: mysql:8
    container_name: intellicampus-db
    restart: unless-stopped
    ports:
      - "${DB_PORT_EXTERNAL:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-intellicampus}
      MYSQL_USER: ${DB_USER:-campus_admin}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" || mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER -p\"$$MYSQL_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - campus-network

  redis:
    image: redis:7-alpine
    container_name: intellicampus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - campus-network

networks:
  campus-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
